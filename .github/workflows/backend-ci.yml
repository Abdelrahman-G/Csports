name: CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run unit and infrastructure integration tests
        working-directory: backend
        run: ./mvnw --batch-mode clean verify -Pintegration-tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and build frontend
        working-directory: frontend
        run: npm run lint && npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: 0f1e9099d03b7b54b95f683e1d1908dd623e17ad0fc20f9e4537f634140f1bdb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f infrastructure/docker-compose.yml config --quiet

      - name: Build application images
        run: docker compose -f infrastructure/docker-compose.yml build
