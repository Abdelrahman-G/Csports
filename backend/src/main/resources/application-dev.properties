# Local defaults match infrastructure/docker-compose.yml and may be overridden.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/csports}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Allows an existing pre-Flyway local schema to be adopted as version 1.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Development-only fallback. Production has no fallback.
jwt.secret=${JWT_SECRET:0f1e9099d03b7b54b95f683e1d1908dd623e17ad0fc20f9e4537f634140f1bdb}
