# Local defaults match infrastructure/docker-compose.yml and may be overridden.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/csports}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Allows an existing pre-Flyway local schema to be adopted as version 1.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Development-only fallback. Production has no fallback.
jwt.secret=${JWT_SECRET:71c2d52d429dd7b9cb7cf54b091119845dd7f2d0705a45051ebb64a4b0e6e974}
