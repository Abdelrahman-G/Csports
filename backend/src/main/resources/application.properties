spring.application.name=Csports
spring.profiles.default=dev

# Flyway owns schema changes. Hibernate only checks that entities and migrations agree.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1

jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
spring.cache.type=redis

# Only health is exposed for container orchestration. Environment values,
# configuration properties, and other actuator endpoints stay private.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Redis coordinates requests competing for the same session's seats. The
# database remains the final correctness boundary when Redis is unavailable.
csports.booking-lock.enabled=${BOOKING_LOCK_ENABLED:true}
csports.booking-lock.wait-time=${BOOKING_LOCK_WAIT_TIME:2s}
csports.booking-lock.lease-time=${BOOKING_LOCK_LEASE_TIME:10s}
csports.booking-lock.retry-interval=${BOOKING_LOCK_RETRY_INTERVAL:50ms}
